<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task - Login Form</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div class="wrapper">
    <div class="left">
      <div>
        <h1>Let's get in touch</h1>
      </div>
      <div>
        <p>
          Lorem ipsum dolor sit amet consectetur, adipisicing elit. Dicta,
          natus. Lorem ipsum dolor sit amet consectetur adipisicing elit. Sit,
          quisquam.
        </p>
      </div>
      <div class="contact">
        <p><i class="fa-solid fa-map"></i>123 st. Peshawar Pakistan</p>
        <p><i class="fa-solid fa-envelope"></i>support@example.com</p>
        <p><i class="fa-solid fa-phone"></i>+92 123456789</p>
      </div>
      <div class="social">
        <p>Connect with us</p>
        <a href="https://facebook.com">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="https://twitter.com">
          <i class="fa-brands fa-twitter"></i>
        </a>
        <a href="https://instagram.com">
          <i class="fa-brands fa-instagram"></i>
        </a>
      </div>
    </div>
    <div class="right">
      <h1>Contact Us</h1>
      <form action="">
        <!-- username - email - phone - message -->
        <input type="text" name="username" id="username" placeholder="name" />
        <input type="email" name="email" id="email" placeholder="email" />
        <input type="tel" name="phone" id="phone" placeholder="phone" />
        <textarea name="message" id="message" cols="30" rows="6" placeholder="message"></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </div>
</body>

</html>
