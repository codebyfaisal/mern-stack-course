<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS - Transform</title>
    <style>
      .box {
        width: 100px;
        height: 100px;
        background-color: red;
      }
      .box1 {
        /* transform: scaleX(2.7); */
        /* transform: translateY(-20px); */
        /* transform: rotateZ(30deg); */
        /* transform: matrix(2, 2, 2, 2, 2, 2); */
        /* transform: rotate(10deg) skew(30deg, 30deg); */
        /* animation: name duration timing-function delay iteration-count direction fill-mode;; */

        animation-name: moving;
        animation-duration:5s;
        /* animation-timing-function: cubic-bezier(0.55,-0.42, 0, 1.29);
        animation-iteration-count: 3;
        animation-direction: alternate-reverse; */
        /* animation-delay: 2s; */
        /* animation-fill-mode: both; */
        transform: scale(1.2) translate(100%) rotate(20deg);
        /* translate: 10%, 20%; */
        border-radius: 100% 0% 54% 46% / 46% 35% 65% 54%;
    }
    
      .box1:hover {
        /* transition: all 3s ease; */
        /* transform: rotateZ(360deg); */
        /* transition-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1); */
      }

      @keyframes moving {
        0%{ transform: scale(1);}
        30%{ transform: scale(1.1);}
        60%{ transform: scale(1.8);}
        90%{ transform: scale(1.9);}
        /* 40%{ transform: scale(1.4);}
        50%{ transform: scale(1.3);}
        60%{ transform: scale(1.3);}
        70%{ transform: scale(1.7);} */
        /* 80%{ transform: scale(1.6);}
        90%{ transform: scale(1.2);} */
        100%{
             transform: scale(1.6);
             transform: scale(1.2) translate(100%) rotate(20deg);
            }
      }
    </style>
  </head>
  <body>
    <!-- <div class="box"></div> -->
    <div class="box box1"></div>
  </body>
</html>
