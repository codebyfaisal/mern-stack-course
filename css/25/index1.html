    <title>Document</title>
    <style>
      .wrapper {
        width: 100%;
        margin: 0 auto;
        /* columns: 5; */
        columns: 6;
      }

      .box {
        position: relative;
        overflow: hidden;
        border-radius: 10px;
        margin: 10px 0;
      }

      .placeholder {
        width: 100%;
        height: 100%;
        background-color: lightgray;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        z-index: -1;
      }

      img {
        width: 100%;
        object-fit: cover;
        z-index: 2;
        transition: all 0.5s ease-in-out;
        position: relative;
      }

      .overlay {
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0);
        position: absolute;
        top: 0;
        left: 0;
        z-index: 3;
      }

      .box:hover .overlay {
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0),
          rgba(0, 0, 0, 0.5)
        );
      }
    </style>
  </head>
