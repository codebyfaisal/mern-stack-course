<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS - Bootstrap</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
      integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <table
      class="table table-bordered table-primary table-responsive w-50 mx-auto"
    >
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">First</th>
          <th scope="col">Last</th>
          <th scope="col">Handle</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">1</th>
          <td>Mark</td>
          <td>Otto</td>
          <td>@mdo</td>
        </tr>
        <tr>
          <th scope="row">2</th>
          <td>Jacob</td>
          <td>Thornton</td>
          <td>@fat</td>
        </tr>
        <tr>
          <th scope="row">3</th>
          <td>John</td>
          <td>Doe</td>
          <td>@social</td>
        </tr>
      </tbody>
    </table>
    <div style="width: 200px; height: 200px" class="rounded mx-auto">
      <img
        src="https://images.unsplash.com/photo-1762515303947-cef3ea72386d?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=871"
        class="img-thumbnail rounded"
        alt="..."
      />
    </div>
    <div style="width: 200px; height: 200px" class="rounded">
      <img
        src="https://images.unsplash.com/photo-1762515303947-cef3ea72386d?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=871"
        class="img-thumbnail rounded"
        alt="..."
      />
    </div>

    <div class="text-center">
      <img
        src="https://images.unsplash.com/photo-1762515303947-cef3ea72386d?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=871"
        class=""
        alt="..."
      />
    </div>

    <picture>
      <source
        srcset="
          https://images.unsplash.com/photo-1762515303947-cef3ea72386d?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=871
        "
        type="image/svg+xml"
      />
      <img
        src="https://images.unsplash.com/photo-1762515303947-cef3ea72386d?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=871"
        class="img-fluid img-thumbnail"
        alt="..."
      />
    </picture>

    <figure class="figure clearfix border border-1 border-black">
      <img
        src="https://images.unsplash.com/photo-1762515303947-cef3ea72386d?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=871"
        class="figure-img img-fluid rounded"
        alt="..."
      />
      <figcaption class="figure-caption">
        A caption for the above image.
      </figcaption>
    </figure>

    <form class="w-50 mx-auto shadow p-3 rounded g-3">
      <div class="mb-2">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" class="form-control" />
      </div>
      <div class="mb-2">
        <label for="password">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          class="form-control"
          disabled
        />
      </div>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>

    <form class="form-floating">
      <input
        type="email"
        class="form-control"
        id="floatingInputInvalid"
        placeholder="name@example.com"
        value="test@example.com"
      />
      <label for="floatingInputInvalid">Invalid input</label>
    </form>

    <form>
      <fieldset>
        <legend>Disabled fieldset example</legend>
        <div class="mb-3">
          <label for="disabledTextInput" class="form-label"
            >Disabled input</label
          >

          <input
            type="text"
            id="disabledTextInput"
            class="form-control"
            placeholder="Disabled input"
          />
        </div>
        <div class="mb-3">
          <label for="disabledSelect" class="form-label"
            >Disabled select menu</label
          >
          <select
            class="form-select form-select-sm"
            aria-label=".form-select-lg Default select example"
          >
            <option selected>Open this select menu</option>
            <option value="1">One</option>
            <option value="2">Two</option>
            <option value="3">Three</option>
          </select>
        </div>
        <div class="mb-3">
          <div class="form-check">
            <input
              class="form-check-input"
              type="checkbox"
              id="disabledFieldsetCheck"
              disabled
            />
            <label class="form-check-label" for="disabledFieldsetCheck">
              Can't check this
            </label>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </fieldset>
    </form>

    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        id="flexSwitchCheckDefault"
      />
      <label class="form-check-label" for="flexSwitchCheckDefault"
        >Default switch checkbox input</label
      >
    </div>
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        id="flexSwitchCheckChecked"
        checked
      />
      <label class="form-check-label" for="flexSwitchCheckChecked"
        >Checked switch checkbox input</label
      >
    </div>
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        id="flexSwitchCheckDisabled"
        disabled
      />
      <label class="form-check-label" for="flexSwitchCheckDisabled"
        >Disabled switch checkbox input</label
      >
    </div>
    <div class="form-check form-switch">
      <input
        class="form-check-input"
        type="checkbox"
        id="flexSwitchCheckCheckedDisabled"
        checked
        disabled
      />
      <label class="form-check-label" for="flexSwitchCheckCheckedDisabled"
        >Disabled checked switch checkbox input</label
      >
    </div>
  </body>
</html>
